<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Practise product design whiteboard interviews with an AI interviewer." />
    <title>Wytboard</title>
    <script>
      // Apply the saved theme before first paint so the page doesn't flash.
      try {
        if (localStorage.getItem('wytboard-theme') === 'dark') {
          document.documentElement.classList.add('dark')
          document.documentElement.dataset.theme = 'dark'
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
